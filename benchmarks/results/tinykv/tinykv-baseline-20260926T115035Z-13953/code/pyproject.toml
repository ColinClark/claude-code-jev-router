[project]
name = "tinykv"
version = "0.1.0"
description = "A small persistent JSON key-value store with TTL, atomic writes and file locking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tinykv = "tinykv.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinykv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
