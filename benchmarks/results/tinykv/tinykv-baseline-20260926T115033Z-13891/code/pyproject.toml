[project]
name = "tinykv"
version = "0.1.0"
description = "A small persistent JSON key-value store with TTLs, atomic writes and file locking."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tinykv = "tinykv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinykv"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
