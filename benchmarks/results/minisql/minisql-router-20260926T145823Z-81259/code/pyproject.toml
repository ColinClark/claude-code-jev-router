[project]
name = "minisql"
version = "0.1.0"
description = "An in-memory SQL database engine with SQLite-compatible semantics, in pure Python"
readme = "README.md"
authors = [
    { name = "Colin Clark" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long SQL strings in the differential test tables read better unwrapped.
"tests/*" = ["E501"]
