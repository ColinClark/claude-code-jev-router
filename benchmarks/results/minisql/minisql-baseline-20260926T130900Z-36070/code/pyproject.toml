[project]
name = "minisql"
version = "0.1.0"
description = "An in-memory SQL database engine in pure Python"
readme = "README.md"
authors = [
    { name = "Colin Clark", email = "colin@clark.ws" }
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
