[project]
name = "jev-router"
version = "0.1.0"
description = "Jev-backed decision MCP server and workspace evidence collector for Claude Code model routing"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.scripts]
jev-router-mcp = "jev_router.server:main"
router-evidence = "jev_router.evidence:main"
router-report = "jev_router.usage:main"
router-gate = "jev_router.gate:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S603", "S607", "S311"]  # evidence collector runs subprocesses; random is only retry jitter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S108"]
"scripts/*" = ["S101"]
"src/jev_router/evidence.py" = ["S602"]  # checks are repository commands supplied by the orchestrator

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
